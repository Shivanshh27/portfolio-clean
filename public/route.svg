<svg width="500" height="300" viewBox="0 0 500 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f" />
      <stop offset="100%" stop-color="#121824" />
    </linearGradient>

    <!-- Path Glow Gradient -->
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="pathGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" rx="12" fill="url(#bgGrad)" />

  <!-- Geographic Constellation grid representation -->
  <path d="M 0 50 L 500 50 M 0 100 L 500 100 M 0 150 L 500 150 M 0 200 L 500 200 M 0 250 L 500 250" stroke="#ffffff" stroke-opacity="0.01" stroke-width="1" />
  <path d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300" stroke="#ffffff" stroke-opacity="0.01" stroke-width="1" />

  <!-- Ambient Glow in center (Algorithm gold accent) -->
  <circle cx="280" cy="150" r="80" fill="#f59e0b" fill-opacity="0.06" filter="url(#softGlow)" />
  <!-- Ambient Glow in left (Cyan node accent) -->
  <circle cx="160" cy="180" r="60" fill="#06b6d4" fill-opacity="0.05" filter="url(#softGlow)" />

  <!-- Premium Main Card -->
  <rect x="40" y="40" width="420" height="220" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="40" y="40" width="420" height="30" rx="10" fill="#ffffff" fill-opacity="0.03" />
  <circle cx="60" cy="55" r="5" fill="#ff5f56" />
  <circle cx="75" cy="55" r="5" fill="#ffbd2e" />
  <circle cx="90" cy="55" r="5" fill="#27c93f" />
  <text x="180" y="60" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1">pathfinding.visualizer</text>

  <!-- Left Sidebar (Options Panel) -->
  <g transform="translate(55, 85)">
    <rect x="0" y="0" width="105" height="160" rx="6" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-opacity="0.05" />
    <text x="10" y="16" fill="#ffffff" fill-opacity="0.6" font-family="system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="0.5">ALGORITHMS</text>
    
    <!-- Active selection A* -->
    <rect x="8" y="26" width="89" height="18" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.3" />
    <circle cx="16" cy="35" r="3" fill="#f59e0b" />
    <text x="26" y="38" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="8" font-weight="600">A* Search</text>

    <!-- Dijkstra -->
    <rect x="8" y="48" width="89" height="18" rx="4" fill="#ffffff" fill-opacity="0.02" />
    <circle cx="16" cy="57" r="3" fill="#ffffff" fill-opacity="0.3" />
    <text x="26" y="60" fill="#ffffff" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="8">Dijkstra</text>

    <!-- BFS -->
    <rect x="8" y="70" width="89" height="18" rx="4" fill="#ffffff" fill-opacity="0.02" />
    <circle cx="16" cy="79" r="3" fill="#ffffff" fill-opacity="0.3" />
    <text x="26" y="82" fill="#ffffff" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="8">BFS (Fewest Hops)</text>

    <!-- DFS -->
    <rect x="8" y="92" width="89" height="18" rx="4" fill="#ffffff" fill-opacity="0.02" />
    <circle cx="16" cy="101" r="3" fill="#ffffff" fill-opacity="0.3" />
    <text x="26" y="104" fill="#ffffff" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="8">DFS</text>
    
    <!-- Run button -->
    <rect x="8" y="128" width="89" height="22" rx="4" fill="#f59e0b" filter="url(#nodeGlow)" />
    <text x="28" y="142" fill="#080a0f" font-family="system-ui, sans-serif" font-size="9" font-weight="700">RUN SEARCH</text>
  </g>

  <!-- Interactive pathfinding network representation -->
  <g transform="translate(175, 85)">
    <rect x="0" y="0" width="270" height="160" rx="6" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-opacity="0.03" />

    <!-- Unused edges (subtle) -->
    <line x1="30" y1="40" x2="90" y2="20" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />
    <line x1="30" y1="40" x2="50" y2="90" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />
    <line x1="90" y1="20" x2="160" y2="30" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />
    <line x1="50" y1="90" x2="110" y2="120" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />
    <line x1="160" y1="30" x2="220" y2="60" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />
    <line x1="110" y1="120" x2="180" y2="130" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />
    <line x1="180" y1="130" x2="240" y2="110" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />
    <line x1="220" y1="60" x2="240" y2="110" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />

    <!-- Shortest path route (Gold glowing) -->
    <path d="M 30 40 L 90 70 L 150 90 L 180 60 L 240 110" stroke="url(#pathGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#pathGlow)" />

    <!-- Graph Nodes (Standard ones) -->
    <circle cx="90" cy="20" r="4" fill="#ffffff" fill-opacity="0.2" />
    <circle cx="50" cy="90" r="4" fill="#ffffff" fill-opacity="0.2" />
    <circle cx="160" cy="30" r="4" fill="#ffffff" fill-opacity="0.2" />
    <circle cx="110" cy="120" r="4" fill="#ffffff" fill-opacity="0.2" />
    <circle cx="180" cy="130" r="4" fill="#ffffff" fill-opacity="0.2" />
    <circle cx="220" cy="60" r="4" fill="#ffffff" fill-opacity="0.2" />

    <!-- Route Nodes (Cyan glowing along gold path) -->
    <circle cx="30" cy="40" r="6" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5" filter="url(#nodeGlow)" /> <!-- START -->
    <circle cx="90" cy="70" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="1" />
    <circle cx="150" cy="90" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="1" />
    <circle cx="180" cy="60" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="1" />
    <circle cx="240" cy="110" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5" /> <!-- END -->

    <!-- Microsecond latency flag -->
    <g transform="translate(150, 10)">
      <rect x="0" y="0" width="105" height="18" rx="9" fill="#080a0f" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
      <text x="10" y="12" fill="#ffffff" fill-opacity="0.8" font-family="system-ui, sans-serif" font-size="7" font-weight="600">Redis Cache: HIT (1.2ms)</text>
    </g>
  </g>
</svg>
