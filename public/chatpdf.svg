<svg width="500" height="300" viewBox="0 0 500 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#141c2c" />
    </linearGradient>

    <!-- Accent Colors -->
    <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <linearGradient id="msgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" rx="12" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <path d="M 0 50 L 500 50 M 0 100 L 500 100 M 0 150 L 500 150 M 0 200 L 500 200 M 0 250 L 500 250" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1" />
  <path d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1" />

  <!-- Ambient Glow -->
  <circle cx="380" cy="180" r="70" fill="#3b82f6" fill-opacity="0.08" filter="url(#softGlow)" />
  <circle cx="120" cy="120" r="60" fill="#ef4444" fill-opacity="0.05" filter="url(#softGlow)" />

  <!-- Premium Main Card -->
  <rect x="40" y="40" width="420" height="220" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="40" y="40" width="420" height="30" rx="10" fill="#ffffff" fill-opacity="0.03" />
  <circle cx="60" cy="55" r="5" fill="#ff5f56" />
  <circle cx="75" cy="55" r="5" fill="#ffbd2e" />
  <circle cx="90" cy="55" r="5" fill="#27c93f" />
  <text x="210" y="60" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1">chatpdf.ai</text>

  <!-- Left: PDF document viewer mockup -->
  <g transform="translate(60, 85)">
    <rect x="0" y="0" width="130" height="160" rx="6" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-opacity="0.04" />
    <text x="8" y="16" fill="#ffffff" fill-opacity="0.6" font-family="system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.5">SOURCE PDF</text>
    
    <!-- PDF Doc Card -->
    <rect x="20" y="30" width="90" height="110" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.1" />
    
    <!-- PDF Logo tag -->
    <rect x="35" y="45" width="60" height="30" rx="2" fill="url(#pdfGrad)" filter="url(#redGlow)" />
    <text x="65" y="64" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">PDF</text>
    
    <!-- PDF Text Lines -->
    <rect x="30" y="90" width="70" height="4" rx="2" fill="#ffffff" fill-opacity="0.2" />
    <rect x="30" y="100" width="70" height="4" rx="2" fill="#ffffff" fill-opacity="0.2" />
    <rect x="30" y="110" width="50" height="4" rx="2" fill="#ffffff" fill-opacity="0.2" />
  </g>

  <!-- Right: Conversational UI Chat stream mockup -->
  <g transform="translate(205, 85)">
    <rect x="0" y="0" width="235" height="160" rx="6" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-opacity="0.04" />
    <text x="10" y="16" fill="#ffffff" fill-opacity="0.6" font-family="system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="0.5">AI CHAT INTERFACE</text>

    <!-- User Bubble -->
    <rect x="55" y="30" width="170" height="30" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.04" />
    <text x="65" y="48" fill="#ffffff" fill-opacity="0.6" font-family="system-ui, sans-serif" font-size="8">Summarize chapter 3...</text>

    <!-- Vector DB Search Line indicator -->
    <path d="M 30 75 Q 117 75 205 75" stroke="#3b82f6" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.6" />
    <circle cx="117" cy="75" r="4" fill="#3b82f6" filter="url(#blueGlow)" />
    <text x="127" y="78" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="7" font-weight="700">Pinecone Query</text>

    <!-- AI Response Bubble -->
    <rect x="10" y="90" width="180" height="55" rx="6" fill="url(#msgGrad)" filter="url(#blueGlow)" />
    <rect x="20" y="104" width="160" height="4" rx="2" fill="#ffffff" />
    <rect x="20" y="114" width="160" height="4" rx="2" fill="#ffffff" />
    <rect x="20" y="124" width="120" height="4" rx="2" fill="#ffffff" />
  </g>
</svg>
