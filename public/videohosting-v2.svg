<svg width="500" height="300" viewBox="0 0 500 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0914" />
      <stop offset="100%" stop-color="#1f1127" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" rx="12" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <path d="M 0 50 L 500 50 M 0 100 L 500 100 M 0 150 L 500 150 M 0 200 L 500 200 M 0 250 L 500 250" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1" />
  <path d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1" />

  <!-- Ambient Glow in center (Purple accent) -->
  <circle cx="250" cy="150" r="80" fill="#a855f7" fill-opacity="0.06" filter="url(#softGlow)" />
  <!-- Ambient Glow in left (Pink accent) -->
  <circle cx="120" cy="120" r="60" fill="#ec4899" fill-opacity="0.05" filter="url(#softGlow)" />

  <!-- Premium Main Card -->
  <rect x="40" y="40" width="420" height="220" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="40" y="40" width="420" height="30" rx="10" fill="#ffffff" fill-opacity="0.03" />
  <circle cx="60" cy="55" r="5" fill="#ff5f56" />
  <circle cx="75" cy="55" r="5" fill="#ffbd2e" />
  <circle cx="90" cy="55" r="5" fill="#27c93f" />
  <text x="180" y="60" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1">video-hosting.backend</text>

  <!-- Left: Media Player / Stream Display Mockup -->
  <g transform="translate(60, 85)">
    <rect x="0" y="0" width="160" height="110" rx="6" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.05" />
    
    <!-- Player Play icon -->
    <circle cx="80" cy="55" r="22" fill="url(#accentGrad)" filter="url(#purpleGlow)" />
    <path d="M 74 45 L 92 55 L 74 65 Z" fill="#ffffff" />
    
    <!-- Video Player Progress bar -->
    <rect x="10" y="96" width="140" height="4" rx="2" fill="#ffffff" fill-opacity="0.2" />
    <rect x="10" y="96" width="90" height="4" rx="2" fill="url(#accentGrad)" />
    <circle cx="100" cy="98" r="3" fill="#ffffff" />
    
    <!-- Metadata below player -->
    <rect x="0" y="122" width="160" height="28" rx="4" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.04" />
    <text x="10" y="139" fill="#ffffff" fill-opacity="0.6" font-family="system-ui, sans-serif" font-size="8" font-weight="600">REST API Gateway — Node/Express</text>
  </g>

  <!-- Right: Storage Cloud Upload &amp; DB Sync Mockup -->
  <g transform="translate(235, 85)">
    <rect x="0" y="0" width="205" height="160" rx="6" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-opacity="0.04" />
    <text x="10" y="16" fill="#ffffff" fill-opacity="0.6" font-family="system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="0.5">MEDIA &amp; STORAGE STACK</text>

    <!-- Cloud uploads box -->
    <g transform="translate(10, 26)">
      <rect x="0" y="0" width="185" height="50" rx="4" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-opacity="0.03" />
      
      <!-- Cloud Outline -->
      <path d="M 30 35 A 8 8 0 0 1 45 28 A 12 12 0 0 1 65 32 A 8 8 0 0 1 70 42 L 30 42 Z" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" />
      
      <!-- Arrow pointing to cloud -->
      <path d="M 50 35 L 50 48 M 47 38 L 50 35 L 53 38" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#purpleGlow)" />
      
      <text x="85" y="27" fill="#ffffff" fill-opacity="0.8" font-family="system-ui, sans-serif" font-size="8" font-weight="700">Multer &amp; Cloudinary</text>
      <text x="85" y="38" fill="#ffffff" fill-opacity="0.3" font-family="system-ui, sans-serif" font-size="7">Dynamic upload pipeline</text>
    </g>

    <!-- Database schemas box -->
    <g transform="translate(10, 88)">
      <rect x="0" y="0" width="185" height="62" rx="4" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-opacity="0.03" />
      
      <!-- DB cylinder stack -->
      <g transform="translate(15, 8)">
        <ellipse cx="20" cy="10" rx="12" ry="4" fill="url(#accentGrad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
        
        <path d="M 8 10 L 8 20 A 12 4 0 0 0 32 20 L 32 10" fill="url(#accentGrad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
        <path d="M 8 20 L 8 30 A 12 4 0 0 0 32 30 L 32 20" fill="url(#accentGrad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" filter="url(#purpleGlow)" />
      </g>

      <text x="55" y="22" fill="#ffffff" fill-opacity="0.8" font-family="system-ui, sans-serif" font-size="8" font-weight="700">MongoDB / Mongoose</text>
      <text x="55" y="33" fill="#ffffff" fill-opacity="0.3" font-family="system-ui, sans-serif" font-size="7">Securewatch &amp; Auth history</text>
      <text x="55" y="44" fill="#ffffff" fill-opacity="0.3" font-family="system-ui, sans-serif" font-size="7">REST API collection models</text>
    </g>
  </g>
</svg>
