<svg width="500" height="300" viewBox="0 0 500 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="viqBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e14" />
      <stop offset="100%" stop-color="#0f1924" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="viqCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="viqEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="viqCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="viqCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="viqSoftGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" rx="12" fill="url(#viqBgGrad)" />

  <!-- Grid overlay -->
  <path d="M 0 50 L 500 50 M 0 100 L 500 100 M 0 150 L 500 150 M 0 200 L 500 200 M 0 250 L 500 250" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
  <path d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />

  <!-- Ambient Glows -->
  <circle cx="410" cy="90" r="70" fill="#06b6d4" fill-opacity="0.07" filter="url(#viqSoftGlow)" />
  <circle cx="90" cy="220" r="60" fill="#3b82f6" fill-opacity="0.06" filter="url(#viqSoftGlow)" />

  <!-- Main Card Container -->
  <rect x="40" y="35" width="420" height="230" rx="10" fill="url(#viqCardGrad)" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="40" y="35" width="420" height="30" rx="10" fill="#ffffff" fill-opacity="0.03" />
  <circle cx="60" cy="50" r="5" fill="#ff5f56" />
  <circle cx="75" cy="50" r="5" fill="#ffbd2e" />
  <circle cx="90" cy="50" r="5" fill="#27c93f" />
  <text x="200" y="54" fill="#ffffff" fill-opacity="0.45" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">VendorIQ Analytics</text>

  <!-- Left Stats & Metrics -->
  <g transform="translate(60, 80)">
    <!-- Metric 1: Transactions -->
    <rect x="0" y="0" width="180" height="42" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="12" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="500">TRANSACTIONS ANALYZED</text>
    <text x="12" y="34" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">102,488 Rows</text>

    <!-- Metric 2: SQL Aggregation Latency -->
    <rect x="0" y="50" width="180" height="42" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="12" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="500">SQL CTE EXECUTION</text>
    <text x="12" y="84" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">&lt; 0.85s (SQLite)</text>

    <!-- Metric 3: Data Quality Tests -->
    <rect x="0" y="100" width="180" height="42" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="12" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="500">DATA QUALITY ENGINE</text>
    <text x="12" y="134" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="14" font-weight="700">22/22 Tests Passed</text>
  </g>

  <!-- Right: 4-Quadrant Vendor Classification Matrix -->
  <g transform="translate(260, 80)">
    <rect x="0" y="0" width="180" height="142" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06" />
    <text x="12" y="18" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600">4-Quadrant Vendor Matrix</text>

    <!-- Quadrant Axes -->
    <line x1="15" y1="80" x2="165" y2="80" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="90" y1="28" x2="90" y2="132" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Q1: High Sales / Low Margin -->
    <rect x="20" y="32" width="65" height="44" rx="4" fill="#0284c7" fill-opacity="0.12" />
    <text x="25" y="46" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="8" font-weight="600">Volume Core</text>
    <circle cx="35" cy="62" r="3" fill="#38bdf8" />
    <circle cx="50" cy="55" r="4" fill="#38bdf8" />
    <circle cx="68" cy="65" r="2.5" fill="#38bdf8" />

    <!-- Q2: High Sales / High Margin (Stars) -->
    <rect x="95" y="32" width="65" height="44" rx="4" fill="#059669" fill-opacity="0.18" />
    <text x="100" y="46" fill="#34d399" font-family="system-ui, sans-serif" font-size="8" font-weight="700">Top Tier ★</text>
    <circle cx="115" cy="56" r="4" fill="#34d399" filter="url(#viqCyanGlow)" />
    <circle cx="135" cy="50" r="5" fill="#34d399" />
    <circle cx="145" cy="64" r="3" fill="#34d399" />

    <!-- Q3: Low Sales / Low Margin -->
    <rect x="20" y="84" width="65" height="44" rx="4" fill="#dc2626" fill-opacity="0.1" />
    <text x="25" y="98" fill="#f87171" font-family="system-ui, sans-serif" font-size="8" font-weight="600">Risk Review</text>
    <circle cx="40" cy="112" r="3" fill="#f87171" />
    <circle cx="60" cy="118" r="2.5" fill="#f87171" />

    <!-- Q4: Low Sales / High Margin -->
    <rect x="95" y="84" width="65" height="44" rx="4" fill="#7c3aed" fill-opacity="0.12" />
    <text x="100" y="98" fill="#c084fc" font-family="system-ui, sans-serif" font-size="8" font-weight="600">High Margin</text>
    <circle cx="118" cy="110" r="3.5" fill="#c084fc" />
    <circle cx="140" cy="104" r="3" fill="#c084fc" />
  </g>

  <!-- Bottom Tech Stack Badges -->
  <g transform="translate(60, 234)">
    <rect x="0" y="0" width="75" height="18" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-opacity="0.4" />
    <text x="8" y="12" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="9" font-weight="600">SQLite CTEs</text>

    <rect x="83" y="0" width="55" height="18" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" />
    <text x="91" y="12" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Pandas</text>

    <rect x="146" y="0" width="60" height="18" rx="4" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-opacity="0.4" />
    <text x="154" y="12" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Streamlit</text>

    <rect x="214" y="0" width="105" height="18" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-opacity="0.4" />
    <text x="222" y="12" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="9" font-weight="600">22-Rule Test Suite</text>

    <rect x="327" y="0" width="53" height="18" rx="4" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-opacity="0.4" />
    <text x="335" y="12" fill="#f472b6" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Python</text>
  </g>
</svg>
