<svg width="500" height="300" viewBox="0 0 500 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#1b1e2e" />
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" rx="12" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid overlay -->
  <path d="M 0 50 L 500 50 M 0 100 L 500 100 M 0 150 L 500 150 M 0 200 L 500 200 M 0 250 L 500 250" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
  <path d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />

  <!-- Ambient Glow Blob in bottom right -->
  <circle cx="420" cy="220" r="80" fill="#00f0ff" fill-opacity="0.1" filter="url(#softGlow)" />
  <!-- Ambient Glow Blob in top left -->
  <circle cx="80" cy="80" r="60" fill="#0072ff" fill-opacity="0.08" filter="url(#softGlow)" />

  <!-- Main Showcase Dashboard Card (Glassmorphism mockup) -->
  <rect x="40" y="40" width="420" height="220" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />
  
  <!-- Mockup Top Bar -->
  <rect x="40" y="40" width="420" height="30" rx="10" fill="#ffffff" fill-opacity="0.03" />
  <circle cx="60" cy="55" r="5" fill="#ff5f56" />
  <circle cx="75" cy="55" r="5" fill="#ffbd2e" />
  <circle cx="90" cy="55" r="5" fill="#27c93f" />
  <text x="210" y="60" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1">shopiq-ai.store</text>
  
  <!-- Side Navigation Mockup -->
  <rect x="55" y="85" width="90" height="160" rx="6" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.05" />
  <rect x="65" y="100" width="70" height="10" rx="3" fill="#ffffff" fill-opacity="0.1" />
  <rect x="65" y="120" width="55" height="8" rx="2" fill="#ffffff" fill-opacity="0.05" />
  <rect x="65" y="135" width="60" height="8" rx="2" fill="#ffffff" fill-opacity="0.05" />
  <rect x="65" y="150" width="50" height="8" rx="2" fill="#ffffff" fill-opacity="0.05" />
  
  <!-- Main Grid Items (Products) -->
  <g transform="translate(160, 85)">
    <!-- Product 1 -->
    <rect x="0" y="0" width="135" height="70" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.05" />
    <rect x="10" y="10" width="40" height="35" rx="4" fill="#ffffff" fill-opacity="0.05" />
    <rect x="60" y="15" width="65" height="8" rx="2" fill="#ffffff" fill-opacity="0.15" />
    <rect x="60" y="28" width="40" height="6" rx="2" fill="#ffffff" fill-opacity="0.08" />
    <rect x="60" y="45" width="30" height="10" rx="3" fill="url(#accentGrad)" fill-opacity="0.8" />
    
    <!-- Product 2 -->
    <rect x="150" y="0" width="135" height="70" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.05" />
    <rect x="160" y="10" width="40" height="35" rx="4" fill="#ffffff" fill-opacity="0.05" />
    <rect x="210" y="15" width="65" height="8" rx="2" fill="#ffffff" fill-opacity="0.15" />
    <rect x="210" y="28" width="40" height="6" rx="2" fill="#ffffff" fill-opacity="0.08" />
    <rect x="210" y="45" width="30" height="10" rx="3" fill="url(#accentGrad)" fill-opacity="0.8" />
  </g>

  <!-- AI VOICE WAVES AND ASSISTANT BUTTON -->
  <g transform="translate(160, 175)">
    <rect x="0" y="0" width="285" height="70" rx="6" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.05" />
    
    <!-- Waveforms -->
    <path d="M 20 35 Q 30 20 40 35 T 60 35 T 80 35 T 100 35 T 120 35 T 140 35 T 160 35" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" filter="url(#glow)" />
    <path d="M 20 35 Q 35 10 50 35 T 80 35 T 110 35 T 140 35 T 160 35" stroke="#0072ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M 20 35 Q 25 45 40 35 T 70 35 T 100 35 T 130 35 T 160 35" stroke="#ffffff" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.3" />

    <!-- Mic icon background bubble -->
    <circle cx="235" cy="35" r="20" fill="url(#accentGrad)" filter="url(#glow)" />
    <!-- Microphone icon -->
    <rect x="231" y="24" width="8" height="14" rx="4" fill="#ffffff" />
    <path d="M 227 30 A 8 8 0 0 0 243 30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
    <line x1="235" y1="38" x2="235" y2="44" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>
  
  <!-- Floating tag overlay -->
  <g transform="translate(290, 20)">
    <rect x="0" y="0" width="145" height="28" rx="14" fill="#0f111a" fill-opacity="0.85" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="1" filter="url(#glow)" />
    <circle cx="14" cy="14" r="5" fill="#00f0ff" filter="url(#glow)" />
    <text x="26" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">Voice Nav Enabled</text>
  </g>
</svg>
