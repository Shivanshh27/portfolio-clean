<svg width="500" height="300" viewBox="0 0 500 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a13" />
      <stop offset="100%" stop-color="#161226" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" rx="12" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <path d="M 0 50 L 500 50 M 0 100 L 500 100 M 0 150 L 500 150 M 0 200 L 500 200 M 0 250 L 500 250" stroke="#ffffff" stroke-opacity="0.01" stroke-width="1" />
  <path d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300" stroke="#ffffff" stroke-opacity="0.01" stroke-width="1" />

  <!-- Ambient Glow in center (Purple accent) -->
  <circle cx="250" cy="150" r="70" fill="#8b5cf6" fill-opacity="0.08" filter="url(#softGlow)" />
  <!-- Ambient Glow in left (Blue accent) -->
  <circle cx="120" cy="120" r="60" fill="#3b82f6" fill-opacity="0.06" filter="url(#softGlow)" />

  <!-- Premium Main Card -->
  <rect x="40" y="40" width="420" height="220" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="40" y="40" width="420" height="30" rx="10" fill="#ffffff" fill-opacity="0.03" />
  <circle cx="60" cy="55" r="5" fill="#ff5f56" />
  <circle cx="75" cy="55" r="5" fill="#ffbd2e" />
  <circle cx="90" cy="55" r="5" fill="#27c93f" />
  <text x="195" y="60" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1">resumebuilder.ai</text>

  <!-- Left: Sidebar / Editor Panel Mockup -->
  <g transform="translate(60, 85)">
    <rect x="0" y="0" width="130" height="160" rx="6" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-opacity="0.04" />
    <text x="8" y="16" fill="#ffffff" fill-opacity="0.6" font-family="system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.5">EDITOR PANEL</text>
    
    <!-- Edit field 1 -->
    <rect x="8" y="26" width="114" height="20" rx="3" fill="#ffffff" fill-opacity="0.03" />
    <text x="14" y="38" fill="#ffffff" fill-opacity="0.25" font-family="system-ui, sans-serif" font-size="8">Full Name...</text>
    
    <!-- Edit field 2 (AI Optimization text area) -->
    <rect x="8" y="52" width="114" height="40" rx="3" fill="#ffffff" fill-opacity="0.02" stroke="#8b5cf6" stroke-opacity="0.2" />
    <text x="14" y="64" fill="#ffffff" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="8">AI Content Enhancer</text>
    <rect x="14" y="72" width="102" height="4" rx="2" fill="#8b5cf6" fill-opacity="0.3" />
    <rect x="14" y="80" width="82" height="4" rx="2" fill="#8b5cf6" fill-opacity="0.3" />

    <!-- AI Optimize Button -->
    <rect x="8" y="128" width="114" height="22" rx="4" fill="url(#primaryGrad)" filter="url(#purpleGlow)" />
    <text x="32" y="142" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="700" letter-spacing="0.5">OPTIMIZE WITH AI</text>
  </g>

  <!-- Right: Live Preview Resume Sheet -->
  <g transform="translate(210, 85)">
    <rect x="0" y="0" width="230" height="160" rx="6" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-opacity="0.04" />
    <text x="10" y="16" fill="#ffffff" fill-opacity="0.6" font-family="system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="0.5">LIVE TEMPLATE</text>

    <!-- Resume document body mock -->
    <rect x="15" y="30" width="200" height="115" rx="2" fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Header -->
    <circle cx="35" cy="48" r="10" fill="#8b5cf6" />
    <rect x="52" y="42" width="60" height="6" rx="2" fill="#0b0a13" />
    <rect x="52" y="52" width="40" height="4" rx="2" fill="#8b5cf6" fill-opacity="0.6" />

    <!-- Divider line -->
    <line x1="25" y1="66" x2="205" y2="66" stroke="#e2e8f0" stroke-width="1" />

    <!-- Summary block -->
    <rect x="25" y="74" width="180" height="4" rx="2" fill="#64748b" />
    <rect x="25" y="82" width="180" height="4" rx="2" fill="#64748b" />
    <rect x="25" y="90" width="140" height="4" rx="2" fill="#64748b" />

    <!-- Sparkle overlays (indicating AI Optimization success) -->
    <path d="M 180 35 L 182 40 L 187 42 L 182 44 L 180 49 L 178 44 L 173 42 L 178 40 Z" fill="#f59e0b" filter="url(#purpleGlow)" />
    <path d="M 195 48 L 196 51 L 199 52 L 196 53 L 195 56 L 194 53 L 191 52 L 194 51 Z" fill="#8b5cf6" />
  </g>
</svg>
