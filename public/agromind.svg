<svg width="500" height="300" viewBox="0 0 500 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="agroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05160e" />
      <stop offset="100%" stop-color="#0c2317" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="agroCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" rx="12" fill="url(#agroBg)" />

  <!-- Subtle grid lines -->
  <path d="M 0 50 L 500 50 M 0 100 L 500 100 M 0 150 L 500 150 M 0 200 L 500 200 M 0 250 L 500 250" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
  <path d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />

  <!-- Ambient Glow -->
  <circle cx="420" cy="180" r="90" fill="#10b981" fill-opacity="0.1" filter="url(#emeraldGlow)" />
  <circle cx="90" cy="90" r="60" fill="#34d399" fill-opacity="0.08" filter="url(#emeraldGlow)" />

  <!-- Main Card Container -->
  <rect x="35" y="35" width="430" height="230" rx="12" fill="url(#agroCardGrad)" stroke="#10b981" stroke-opacity="0.25" stroke-width="1.2" />

  <!-- Window Header -->
  <rect x="35" y="35" width="430" height="32" rx="12" fill="#ffffff" fill-opacity="0.03" />
  <circle cx="55" cy="51" r="4.5" fill="#ef4444" />
  <circle cx="70" cy="51" r="4.5" fill="#eab308" />
  <circle cx="85" cy="51" r="4.5" fill="#22c55e" />
  <text x="210" y="55" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">AgroMind AI • XAI Engine</text>

  <!-- Left Column: ML Metrics & Soil Parameters -->
  <g transform="translate(50, 80)">
    <rect width="180" height="165" rx="8" fill="#04120a" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="12" y="24" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SOIL & SENSOR TELEMETRY</text>
    
    <!-- Nitrogen Bar -->
    <text x="12" y="48" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Nitrogen (N): 88 mg/kg</text>
    <rect x="12" y="54" width="156" height="5" rx="2.5" fill="#1f2937" />
    <rect x="12" y="54" width="130" height="5" rx="2.5" fill="url(#emeraldGrad)" />

    <!-- Phosphorus Bar -->
    <text x="12" y="76" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Phosphorus (P): 42 mg/kg</text>
    <rect x="12" y="82" width="156" height="5" rx="2.5" fill="#1f2937" />
    <rect x="12" y="82" width="95" height="5" rx="2.5" fill="url(#emeraldGrad)" />

    <!-- pH & Moisture -->
    <text x="12" y="104" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Soil pH: 6.8 (Optimal)</text>
    <rect x="12" y="110" width="156" height="5" rx="2.5" fill="#1f2937" />
    <rect x="12" y="110" width="120" height="5" rx="2.5" fill="url(#goldGrad)" />

    <text x="12" y="132" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Humidity: 82% | Temp: 24°C</text>
    <rect x="12" y="138" width="156" height="5" rx="2.5" fill="#1f2937" />
    <rect x="12" y="138" width="140" height="5" rx="2.5" fill="#38bdf8" />
  </g>

  <!-- Right Column: XAI Prediction & LLM Insights -->
  <g transform="translate(245, 80)">
    <rect width="205" height="165" rx="8" fill="#04120a" fill-opacity="0.8" stroke="#10b981" stroke-opacity="0.2" />
    <text x="14" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">AI PREDICTION & EXPLANATION</text>

    <rect x="14" y="34" width="177" height="36" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" />
    <text x="24" y="50" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Optimal Crop: Wheat / Rice</text>
    <text x="24" y="63" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9">Random Forest Accuracy: 94.6%</text>

    <!-- Factor Confidence Scores -->
    <text x="14" y="88" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Explainable AI (XAI) Weights:</text>
    
    <text x="14" y="105" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="8.5">• Nitrogen Ratio Weight: +38%</text>
    <text x="14" y="118" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="8.5">• Soil Moisture & Humidity: +32%</text>
    <text x="14" y="131" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="8.5">• Microclimate Seasonality: +24%</text>

    <!-- Llama 3 Pill -->
    <rect x="14" y="140" width="177" height="16" rx="4" fill="#065f46" fill-opacity="0.5" />
    <text x="22" y="152" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">Llama 3 Groq Assistant Active</text>
  </g>
</svg>
