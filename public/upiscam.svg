<svg width="500" height="300" viewBox="0 0 500 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="scamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140608" />
      <stop offset="100%" stop-color="#240b10" />
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>

    <linearGradient id="scamCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" rx="12" fill="url(#scamBg)" />

  <!-- Subtle grid lines -->
  <path d="M 0 50 L 500 50 M 0 100 L 500 100 M 0 150 L 500 150 M 0 200 L 500 200 M 0 250 L 500 250" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
  <path d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />

  <!-- Ambient Glow -->
  <circle cx="420" cy="180" r="90" fill="#ef4444" fill-opacity="0.1" filter="url(#crimsonGlow)" />
  <circle cx="90" cy="90" r="60" fill="#f43f5e" fill-opacity="0.08" filter="url(#crimsonGlow)" />

  <!-- Main Card Container -->
  <rect x="35" y="35" width="430" height="230" rx="12" fill="url(#scamCardGrad)" stroke="#ef4444" stroke-opacity="0.25" stroke-width="1.2" />

  <!-- Window Header -->
  <rect x="35" y="35" width="430" height="32" rx="12" fill="#ffffff" fill-opacity="0.03" />
  <circle cx="55" cy="51" r="4.5" fill="#ef4444" />
  <circle cx="70" cy="51" r="4.5" fill="#eab308" />
  <circle cx="85" cy="51" r="4.5" fill="#22c55e" />
  <text x="180" y="55" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">UPI Multi-Modal Fraud Detector</text>

  <!-- Left Column: Multi-branch Signals -->
  <g transform="translate(50, 80)">
    <rect width="180" height="165" rx="8" fill="#110507" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="12" y="24" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">INSPECTION PIPELINE</text>
    
    <!-- Signal 1: NLP SMS -->
    <rect x="12" y="34" width="156" height="34" rx="5" fill="#2d0b0f" stroke="#ef4444" stroke-opacity="0.3" />
    <text x="18" y="48" fill="#fecaca" font-family="system-ui, sans-serif" font-size="9" font-weight="600">SMS / Message Semantics</text>
    <text x="18" y="60" fill="#ef4444" font-family="system-ui, sans-serif" font-size="8.5">Urgent KYC request flagged</text>

    <!-- Signal 2: OpenCV QR -->
    <rect x="12" y="74" width="156" height="34" rx="5" fill="#2d0b0f" stroke="#ef4444" stroke-opacity="0.3" />
    <text x="18" y="88" fill="#fecaca" font-family="system-ui, sans-serif" font-size="9" font-weight="600">OpenCV QR Payload Scanner</text>
    <text x="18" y="100" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="8.5">Mismatched VPA recipient</text>

    <!-- Signal 3: Phishing URL -->
    <rect x="12" y="114" width="156" height="34" rx="5" fill="#2d0b0f" stroke="#ef4444" stroke-opacity="0.3" />
    <text x="18" y="128" fill="#fecaca" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Phishing URL & Domain Check</text>
    <text x="18" y="140" fill="#ef4444" font-family="system-ui, sans-serif" font-size="8.5">Typosquatting detected</text>
  </g>

  <!-- Right Column: Unified Risk Score & Llama 3 Summary -->
  <g transform="translate(245, 80)">
    <rect width="205" height="165" rx="8" fill="#110507" fill-opacity="0.85" stroke="#ef4444" stroke-opacity="0.3" />
    
    <text x="14" y="24" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="700">UNIFIED FRAUD RISK SCORE</text>

    <!-- Gauge / Badge -->
    <rect x="14" y="34" width="177" height="42" rx="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.4" />
    <text x="24" y="52" fill="#ef4444" font-family="system-ui, sans-serif" font-size="13" font-weight="800">89 / 100 — CRITICAL RISK</text>
    <text x="24" y="66" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9">Evaluated in &lt;150ms via FastAPI</text>

    <!-- Llama 3 Risk Analysis Box -->
    <text x="14" y="92" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Llama 3 Safety Explanation:</text>
    
    <rect x="14" y="98" width="177" height="58" rx="5" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="20" y="112" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="8">"High risk of social engineering: fake</text>
    <text x="20" y="124" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="8">electricity bill payment link asking to</text>
    <text x="20" y="136" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="8">authorize money transfer."</text>
    <text x="20" y="149" fill="#34d399" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600">✔ PII Automatically Redacted</text>
  </g>
</svg>
