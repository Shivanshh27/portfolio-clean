<svg width="500" height="300" viewBox="0 0 500 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0813" />
      <stop offset="100%" stop-color="#151025" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" rx="12" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <path d="M 0 50 L 500 50 M 0 100 L 500 100 M 0 150 L 500 150 M 0 200 L 500 200 M 0 250 L 500 250" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1" />
  <path d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1" />

  <!-- Ambient Purple Glow in bottom right -->
  <circle cx="410" cy="210" r="70" fill="#a855f7" fill-opacity="0.08" filter="url(#softGlow)" />
  <!-- Ambient Magenta Glow in top left -->
  <circle cx="90" cy="90" r="60" fill="#ec4899" fill-opacity="0.06" filter="url(#softGlow)" />

  <!-- Premium Main Card -->
  <rect x="40" y="40" width="420" height="220" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="40" y="40" width="420" height="30" rx="10" fill="#ffffff" fill-opacity="0.03" />
  <circle cx="60" cy="55" r="5" fill="#ff5f56" />
  <circle cx="75" cy="55" r="5" fill="#ffbd2e" />
  <circle cx="90" cy="55" r="5" fill="#27c93f" />
  <text x="210" y="60" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1">sleeklink.io</text>

  <!-- URL Registry & Chart Section (Left) -->
  <g transform="translate(55, 85)">
    <!-- Creation Card mockup -->
    <rect x="0" y="0" width="230" height="40" rx="5" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.04" />
    <rect x="8" y="10" width="130" height="20" rx="3" fill="#ffffff" fill-opacity="0.04" />
    <text x="14" y="22" fill="#ffffff" fill-opacity="0.3" font-family="system-ui, sans-serif" font-size="8">Enter original URL...</text>
    
    <rect x="148" y="10" width="74" height="20" rx="3" fill="url(#purpleGrad)" />
    <text x="166" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="700">Shorten URL</text>

    <!-- Registry row with toggle and tiny sparkline -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="230" height="50" rx="5" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-opacity="0.04" />
      
      <!-- Link text -->
      <text x="8" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="600">/nextjs-doc</text>
      <text x="8" y="30" fill="#ffffff" fill-opacity="0.3" font-family="system-ui, sans-serif" font-size="7">https://nextjs.org/docs/app/building-your-application...</text>

      <!-- Active / Pause toggle switch -->
      <text x="180" y="18" fill="#22c55e" font-family="system-ui, sans-serif" font-size="7" font-weight="600">ACTIVE</text>
      <rect x="180" y="24" width="20" height="10" rx="5" fill="#22c55e" />
      <circle cx="195" cy="29" r="4" fill="#ffffff" />
      <text x="208" y="32" fill="#ffffff" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="8">82 clicks</text>
    </g>

    <!-- Click volume chart box -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="230" height="50" rx="5" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-opacity="0.04" />
      <!-- Area fill -->
      <path d="M 10 40 L 40 32 L 80 38 L 120 15 L 160 25 L 200 8 L 220 18 L 220 45 L 10 45 Z" fill="url(#chartGrad)" />
      <!-- Line -->
      <path d="M 10 40 L 40 32 L 80 38 L 120 15 L 160 25 L 200 8 L 220 18" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#purpleGlow)" />
      <text x="8" y="12" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="7" font-weight="600">Timezone-Aware analytics (Last 7 Days)</text>
    </g>
  </g>

  <!-- QR Code & Analytics Sidebar (Right) -->
  <g transform="translate(300, 85)">
    <rect x="0" y="0" width="145" height="160" rx="6" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-opacity="0.05" />
    
    <!-- QR Code Outer Card -->
    <rect x="27" y="15" width="90" height="90" rx="5" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.05" />
    
    <!-- Stylized QR Code vector blocks -->
    <g transform="translate(35, 23)" fill="#ffffff" fill-opacity="0.75">
      <!-- Top-Left Position Detection -->
      <rect x="0" y="0" width="20" height="20" rx="2" stroke="#ffffff" stroke-width="2" fill="none" />
      <rect x="5" y="5" width="10" height="10" rx="1" />
      
      <!-- Top-Right Position Detection -->
      <rect x="54" y="0" width="20" height="20" rx="2" stroke="#ffffff" stroke-width="2" fill="none" />
      <rect x="59" y="5" width="10" height="10" rx="1" />
      
      <!-- Bottom-Left Position Detection -->
      <rect x="0" y="54" width="20" height="20" rx="2" stroke="#ffffff" stroke-width="2" fill="none" />
      <rect x="5" y="59" width="10" height="10" rx="1" />
      
      <!-- Random QR code dots -->
      <rect x="25" y="4" width="6" height="6" rx="1" />
      <rect x="36" y="8" width="8" height="4" rx="1" fill="url(#purpleGrad)" />
      <rect x="25" y="16" width="4" height="8" rx="1" />
      <rect x="34" y="16" width="12" height="4" rx="1" />
      
      <rect x="4" y="26" width="12" height="4" rx="1" />
      <rect x="4" y="34" width="6" height="12" rx="1" />
      <rect x="16" y="30" width="6" height="6" rx="1" />
      <rect x="26" y="26" width="12" height="12" rx="2" fill="url(#purpleGrad)" filter="url(#purpleGlow)" />
      <rect x="42" y="26" width="6" height="8" rx="1" />
      <rect x="54" y="26" width="16" height="4" rx="1" />
      <rect x="64" y="34" width="6" height="12" rx="1" />

      <rect x="26" y="42" width="6" height="16" rx="1" />
      <rect x="36" y="42" width="16" height="6" rx="1" />
      <rect x="54" y="42" width="10" height="10" rx="2" />
      
      <rect x="26" y="64" width="16" height="4" rx="1" fill="url(#purpleGrad)" />
      <rect x="46" y="54" width="6" height="14" rx="1" />
      <rect x="58" y="58" width="12" height="6" rx="1" />
    </g>

    <text x="35" y="122" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle" x-offset="38" class="text-center" width="145">Dynamic Link QR</text>
    <!-- Download button -->
    <rect x="27" y="130" width="90" height="18" rx="4" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="72" y="141" fill="#ffffff" fill-opacity="0.8" font-family="system-ui, sans-serif" font-size="7" font-weight="700" text-anchor="middle">DOWNLOAD SVG</text>
  </g>
</svg>
