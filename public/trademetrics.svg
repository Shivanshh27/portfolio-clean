<svg width="500" height="300" viewBox="0 0 500 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10" />
      <stop offset="100%" stop-color="#141724" />
    </linearGradient>
    
    <!-- Chart and Glow Colors -->
    <linearGradient id="equityGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="drawdownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" rx="12" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <path d="M 0 50 L 500 50 M 0 100 L 500 100 M 0 150 L 500 150 M 0 200 L 500 200 M 0 250 L 500 250" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
  <path d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />

  <!-- Ambient Glow in top right (SQL database accent) -->
  <circle cx="400" cy="80" r="70" fill="#3b82f6" fill-opacity="0.08" filter="url(#softGlow)" />
  <!-- Ambient Glow in bottom left (Green profit accent) -->
  <circle cx="100" cy="220" r="60" fill="#10b981" fill-opacity="0.06" filter="url(#softGlow)" />

  <!-- Premium Main Card -->
  <rect x="40" y="40" width="420" height="220" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="40" y="40" width="420" height="30" rx="10" fill="#ffffff" fill-opacity="0.03" />
  <circle cx="60" cy="55" r="5" fill="#ff5f56" />
  <circle cx="75" cy="55" r="5" fill="#ffbd2e" />
  <circle cx="90" cy="55" r="5" fill="#27c93f" />
  <text x="195" y="60" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1">trademetrics.analytics</text>

  <!-- Left Sidebar Panel Mockup (Strategy Hierarchies) -->
  <g transform="translate(55, 85)">
    <rect x="0" y="0" width="100" height="160" rx="6" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-opacity="0.05" />
    <text x="8" y="18" fill="#ffffff" fill-opacity="0.6" font-family="system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.5">STRATEGIES</text>
    
    <!-- Tree Hierarchy Lines -->
    <rect x="8" y="32" width="84" height="15" rx="3" fill="#3b82f6" fill-opacity="0.15" />
    <text x="14" y="42" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="8" font-weight="600">Intraday Options</text>
    
    <path d="M 18 47 L 18 70 L 25 70" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" fill="none" />
    <rect x="28" y="62" width="64" height="15" rx="3" fill="#ffffff" fill-opacity="0.03" />
    <text x="34" y="72" fill="#ffffff" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="8">5m ORB</text>

    <path d="M 18 47 L 18 95 L 25 95" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" fill="none" />
    <rect x="28" y="87" width="64" height="15" rx="3" fill="#ffffff" fill-opacity="0.03" />
    <text x="34" y="97" fill="#ffffff" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="8">Mean Reversion</text>
  </g>

  <!-- Equity Curve Graph and Analytics Area -->
  <g transform="translate(170, 85)">
    <!-- Statistics row -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="85" height="35" rx="5" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.04" />
      <text x="8" y="13" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="8">Win Rate</text>
      <text x="8" y="27" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700">68.4%</text>

      <rect x="95" y="0" width="85" height="35" rx="5" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.04" />
      <text x="8" y="13" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="8">Max Streak</text>
      <text x="8" y="27" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="12" font-weight="700">8 Wins</text>

      <rect x="190" y="0" width="85" height="35" rx="5" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.04" />
      <text x="8" y="13" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="8">Max Drawdown</text>
      <text x="8" y="27" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="700">-4.2%</text>
    </g>

    <!-- Main Chart Box -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="275" height="112" rx="6" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-opacity="0.04" />
      
      <!-- Graph grids -->
      <line x1="0" y1="28" x2="275" y2="28" stroke="#ffffff" stroke-opacity="0.03" />
      <line x1="0" y1="56" x2="275" y2="56" stroke="#ffffff" stroke-opacity="0.03" />
      <line x1="0" y1="84" x2="275" y2="84" stroke="#ffffff" stroke-opacity="0.03" />
      
      <!-- Running Equity Area Fill -->
      <path d="M 10 90 L 40 75 L 80 82 L 120 45 L 160 55 L 200 25 L 240 38 L 265 15 L 265 105 L 10 105 Z" fill="url(#equityGrad)" />
      
      <!-- Running Equity Line -->
      <path d="M 10 90 L 40 75 L 80 82 L 120 45 L 160 55 L 200 25 L 240 38 L 265 15" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#greenGlow)" />
      
      <!-- Peak Reference Dots -->
      <circle cx="200" cy="25" r="3" fill="#3b82f6" />
      <circle cx="265" cy="15" r="3" fill="#10b981" />
      
      <!-- SQL Trigger Label -->
      <rect x="12" y="8" width="85" height="16" rx="8" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.2" stroke-width="1" />
      <text x="20" y="19" fill="#10b981" font-family="system-ui, sans-serif" font-size="7" font-weight="600" letter-spacing="0.5">PostgreSQL Engine</text>
    </g>
  </g>
</svg>
