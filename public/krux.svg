<svg width="500" height="300" viewBox="0 0 500 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c0e" />
      <stop offset="100%" stop-color="#11191d" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" rx="12" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <path d="M 0 50 L 500 50 M 0 100 L 500 100 M 0 150 L 500 150 M 0 200 L 500 200 M 0 250 L 500 250" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1" />
  <path d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1" />

  <!-- Ambient Glow in bottom left -->
  <circle cx="120" cy="200" r="70" fill="#0ea5e9" fill-opacity="0.07" filter="url(#softGlow)" />
  <!-- Ambient Glow in top right -->
  <circle cx="380" cy="100" r="60" fill="#0284c7" fill-opacity="0.05" filter="url(#softGlow)" />

  <!-- Premium Main Card -->
  <rect x="40" y="40" width="420" height="220" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="40" y="40" width="420" height="30" rx="10" fill="#ffffff" fill-opacity="0.03" />
  <circle cx="60" cy="55" r="5" fill="#ff5f56" />
  <circle cx="75" cy="55" r="5" fill="#ffbd2e" />
  <circle cx="90" cy="55" r="5" fill="#27c93f" />
  <text x="195" y="60" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1">krux.support.sys</text>

  <!-- Left: Active Tickets Log Mockup -->
  <g transform="translate(55, 85)">
    <rect x="0" y="0" width="115" height="160" rx="6" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-opacity="0.04" />
    <text x="8" y="16" fill="#ffffff" fill-opacity="0.6" font-family="system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.5">OPEN TICKETS</text>
    
    <!-- Ticket 1 (Active) -->
    <rect x="8" y="26" width="99" height="32" rx="4" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-opacity="0.3" />
    <circle cx="18" cy="42" r="3" fill="#0ea5e9" filter="url(#cyanGlow)" />
    <rect x="28" y="34" width="60" height="5" rx="1.5" fill="#ffffff" />
    <rect x="28" y="44" width="40" height="4" rx="1" fill="#0ea5e9" fill-opacity="0.6" />

    <!-- Ticket 2 -->
    <rect x="8" y="64" width="99" height="32" rx="4" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.04" />
    <circle cx="18" cy="80" r="3" fill="#ffffff" fill-opacity="0.3" />
    <rect x="28" y="72" width="60" height="5" rx="1.5" fill="#ffffff" fill-opacity="0.3" />
    <rect x="28" y="82" width="45" height="4" rx="1" fill="#ffffff" fill-opacity="0.15" />

    <!-- Ticket 3 -->
    <rect x="8" y="102" width="99" height="32" rx="4" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.04" />
    <circle cx="18" cy="118" r="3" fill="#ffffff" fill-opacity="0.3" />
    <rect x="28" y="110" width="60" height="5" rx="1.5" fill="#ffffff" fill-opacity="0.3" />
    <rect x="28" y="120" width="30" height="4" rx="1" fill="#ffffff" fill-opacity="0.15" />
  </g>

  <!-- Right: Customer Chat & Sync wave -->
  <g transform="translate(180, 85)">
    <rect x="0" y="0" width="265" height="160" rx="6" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-opacity="0.04" />
    
    <!-- Chat log box -->
    <rect x="10" y="15" width="245" height="95" rx="5" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-opacity="0.03" />
    
    <!-- Speech bubble 1 (Left / Customer) -->
    <rect x="20" y="25" width="130" height="24" rx="5" fill="#ffffff" fill-opacity="0.03" />
    <rect x="30" y="35" width="110" height="4" rx="2" fill="#ffffff" fill-opacity="0.4" />
    
    <!-- Speech bubble 2 (Right / Live Agent) -->
    <rect x="105" y="58" width="140" height="38" rx="5" fill="url(#accentGrad)" filter="url(#cyanGlow)" />
    <rect x="115" y="68" width="120" height="4" rx="2" fill="#ffffff" />
    <rect x="115" y="78" width="120" height="4" rx="2" fill="#ffffff" />
    <rect x="115" y="88" width="80" height="4" rx="2" fill="#ffffff" />

    <!-- BroadcastChannel Sync Status Bar -->
    <g transform="translate(10, 122)">
      <rect x="0" y="0" width="245" height="28" rx="4" fill="#070c0e" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.05" />
      
      <!-- BroadCast wave symbol -->
      <path d="M 20 14 Q 25 8 30 14 T 40 14 T 50 14 T 60 14" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round" fill="none" filter="url(#cyanGlow)" />
      
      <!-- Label -->
      <text x="70" y="18" fill="#ffffff" fill-opacity="0.7" font-family="system-ui, sans-serif" font-size="8" font-weight="600">BroadcastChannel API Sync: ACTIVE</text>
    </g>
  </g>
</svg>
